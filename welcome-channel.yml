- type: text
  text: https://cdn.discordapp.com/attachments/917157279441223681/1116416541018292274/image.png
  
- type: embed
  embeds:
    - title: "Welcome to Horizon's End!"
      description: >-
        Horizon's End is a community-built space-based Minecraft server, which allows for movable starships which you can build yourself. We have many other features such as settlement / nation mechanics, sci-fi combat, factories, and base defense.
    
        Be sure to familiarize yourself with the rules and information below. We are an English speaking server. Please be sure to keep your messages in English for ease of communication.
    
    - title: Rules
      description: >-
        As a Community server, we adhere to the Discord [Guidelines](https://discordapp.com/guidelines) and [Terms of Service](https://discordapp.com/terms).

        A shortened version of our rules are listed below. These rules are global. They are subject to change at any time, and we will do our best to inform the community of each instance. Ultimately, it is the players responsibility to stay up-to-date with the rules.
    
        [**These rules can be found in detail here.**](https://wiki.horizonsend.net/index.php/Rules)

    - description: "**If you are in need of any staff support, please open a ticket in <#957723934739021914>.**"

    - fields:
        - name: Server Rules
          value: >-
            1) Respect all players
            
            2) Don't harass players

            3) If you see someone breaking the rules, report it immediately

            4) Staff only moderates within HE (with exceptions)

            5) No sexual or adult content

            6) No advertising other Minecraft servers or paid services

            7) Do not misrepresent rules

            8)No spamming (and English only)

            9) No deceiving server staff

            10) Players that don't fit in with the community are not welcome

            11) Don't argue about the rules or actions that the staff team did

            12) Don't exploit bugs, glitches or mechanics

            13) No hacking or unfair mods

            14) Don't copy other people's builds

            15) Don't grief or steal from claimed land

            16) No alternate accounts allowed

            17) No harming new players

            18) No circumventing the combat tag system

            19) No boosting

            20) Don't build meta-breaking ships

            21) Don't grief planets without reason

            22) Don't bypass safezone protection

            23) Banned or inactive players can transfer assets to other players

            24) Assets that are considered abandoned can be given on request

            25) WorldGuard is not meant to be a safe zone

            26) You can generally reuse assets submitted to Horizon's End

    - fields:
        - name: Global Rules
          value: >-
            - You must be at least 13 years of age to be in the server discord.

            - Do not try to ping everyone or a lot of people.

            - Do not post non-news or low effort content in server-news.

            - Do not argue in server-memes or community-polls, use threads or server-politics instead.

            - If your ticket has been closed, do not open a new one as an extension of the previous one.

            - Do not rule lawyer.
    
